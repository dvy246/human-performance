<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" width="2560" height="1440">
  <defs>
    <!-- Swiss Red Accent Gradient -->
    <linearGradient id="swissRedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3333"/>
      <stop offset="100%" stop-color="#cc1111"/>
    </linearGradient>
    <filter id="swissShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- 1. TV Background Canvas (Pitch Minimalist Slate) -->
  <rect width="2560" height="1440" fill="#070707"/>

  <!-- Swiss Modular Architectural Grid (TV Display) -->
  <g opacity="0.15" stroke="#2b2b2b" stroke-width="0.8">
    <line x1="200" y1="0" x2="200" y2="1440"/>
    <line x1="800" y1="0" x2="800" y2="1440"/>
    <line x1="1400" y1="0" x2="1400" y2="1440"/>
    <line x1="2000" y1="0" x2="2000" y2="1440"/>
    <line x1="2360" y1="0" x2="2360" y2="1440"/>
    <line x1="0" y1="300" x2="2560" y2="300"/>
    <line x1="0" y1="1140" x2="2560" y2="1140"/>
  </g>

  <!-- Technical Registration Crosshairs on TV border -->
  <g stroke="#ff3333" stroke-width="1.2" opacity="0.4">
    <path d="M 190 290 L 210 290 M 200 280 L 200 300"/>
    <path d="M 2350 290 L 2370 290 M 2360 280 L 2360 300"/>
    <path d="M 190 1150 L 210 1150 M 200 1140 L 200 1160"/>
    <path d="M 2350 1150 L 2370 1150 M 2360 1140 L 2360 1160"/>
  </g>

  <!-- ================= 2. SAFE AREA (1546 x 423 at x=507, y=508.5) ================= -->
  <!-- Safe Area Card -->
  <rect x="507" y="508.5" width="1546" height="423" rx="12" fill="#0d0d0d" stroke="#222222" stroke-width="1.2"/>

  <!-- Left Content Group (Anchored at x=585, y=580) -->
  <g transform="translate(585, 580)">
    <!-- Category & Verification Badges -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="105" height="26" rx="4" fill="#181818" stroke="#333333" stroke-width="1"/>
      <text x="52.5" y="17" fill="#ffffff" font-family="-apple-system, 'Inter', sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1.5">DESIGN</text>

      <rect x="115" y="0" width="165" height="26" rx="4" fill="#181818" stroke="#333333" stroke-width="1"/>
      <circle cx="127" cy="13" r="3.5" fill="#ff3333"/>
      <text x="138" y="17" fill="#888888" font-family="monospace" font-size="10.5" font-weight="600" letter-spacing="0.5">Safe-area verified</text>
    </g>

    <!-- Main Headline with Swiss Vertical Red Accent Keyline -->
    <g transform="translate(0, 105)">
      <!-- Vertical Red Anchor Line -->
      <rect x="-18" y="-55" width="4" height="64" fill="#ff3333"/>
      <text x="0" y="0" fill="#ffffff" font-family="-apple-system, 'Helvetica Neue', 'Inter', sans-serif" font-size="78" font-weight="900" letter-spacing="-3">{{TITLE}}</text>
      <!-- Horizontal trailing keyline -->
      <line x1="560" y1="-25" x2="630" y2="-25" stroke="#ff3333" stroke-width="2"/>
    </g>

    <!-- Subtitle: Art Direction / Typography Niche -->
    <text x="0" y="152" fill="#ff3333" font-family="-apple-system, 'Inter', sans-serif" font-size="14.5" font-weight="600" letter-spacing="2">{{TAGLINE}}</text>

    <!-- Design Discipline Pills -->
    <g transform="translate(0, 190)">
      <rect x="0" y="0" width="130" height="26" rx="4" fill="#161616" stroke="#282828" stroke-width="1"/>
      <text x="65" y="17" fill="#cccccc" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">BRAND SYSTEMS</text>

      <rect x="140" y="0" width="140" height="26" rx="4" fill="#161616" stroke="#282828" stroke-width="1"/>
      <text x="210" y="17" fill="#cccccc" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">TYPOGRAPHY</text>

      <rect x="290" y="0" width="150" height="26" rx="4" fill="#161616" stroke="#282828" stroke-width="1"/>
      <text x="365" y="17" fill="#ff3333" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">ART DIRECTION</text>
    </g>

    <!-- Bottom Readout -->
    <g transform="translate(0, 240)">
      <line x1="0" y1="-10" x2="680" y2="-10" stroke="#222222" stroke-width="1"/>
      <text x="0" y="10" fill="#888888" font-family="-apple-system, 'Inter', sans-serif" font-size="12" font-weight="600">STUDIO ARCHIVE • COPENHAGEN / BERLIN</text>
    </g>
  </g>

  <!-- Right Visual Group: Swiss Typography Poster Grid (x=1480, y=553) -->
  <g transform="translate(1480, 553.5)" filter="url(#swissShadow)">
    <rect x="0" y="0" width="490" height="333" rx="10" fill="#121212" stroke="#2b2b2b" stroke-width="1.2"/>

    <!-- Inner Poster Frame with Geometric Composition -->
    <g transform="translate(25, 25)">
      <rect width="440" height="283" fill="#080808" stroke="#1f1f1f" stroke-width="1"/>

      <!-- Bauhaus Composition Geometry -->
      <circle cx="220" cy="140" r="85" fill="none" stroke="#262626" stroke-width="1"/>
      <circle cx="220" cy="140" r="50" fill="#ff3333" fill-opacity="0.9"/>
      <rect x="135" y="135" width="170" height="10" fill="#ffffff"/>
      <line x1="220" y1="30" x2="220" y2="250" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4 4"/>

      <!-- Poster Typographic Text -->
      <text x="20" y="35" fill="#666666" font-family="monospace" font-size="10" letter-spacing="1">INTERNATIONAL STYLE</text>
      <text x="20" y="260" fill="#888888" font-family="monospace" font-size="10.5">GRID SYSTEM No. 03</text>
      <text x="420" y="260" fill="#ff3333" font-family="monospace" font-size="11" font-weight="bold" text-anchor="end">HELVETICA // 1957</text>
    </g>

    <!-- Corner registration marks -->
    <path d="M -8 -8 L 0 -8 M -8 -8 L -8 0" stroke="#ff3333" stroke-width="1.2"/>
    <path d="M 498 -8 L 490 -8 M 498 -8 L 498 0" stroke="#ff3333" stroke-width="1.2"/>
  </g>
</svg>
