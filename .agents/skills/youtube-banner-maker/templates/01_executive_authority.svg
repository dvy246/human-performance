<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" width="2560" height="1440">
  <defs>
    <!-- Executive Ambient Radial Glows -->
    <radialGradient id="execGlow" cx="70%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a251b" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#121316" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a0b0d" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="goldKeyline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0"/>
      <stop offset="20%" stop-color="#d4af37" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#f5e6a8" stop-opacity="1"/>
      <stop offset="80%" stop-color="#d4af37" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5e6a8"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
    <filter id="subtleDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- 1. TV Canvas Bleed Background (2560 x 1440) -->
  <rect width="2560" height="1440" fill="#0a0b0d"/>
  <rect width="2560" height="1440" fill="url(#execGlow)"/>

  <!-- TV Architectural Keylines (Visible on large TV screens) -->
  <g opacity="0.12" stroke="#d4af37" stroke-width="0.5">
    <line x1="250" y1="0" x2="250" y2="1440" stroke-dasharray="8 8"/>
    <line x1="2310" y1="0" x2="2310" y2="1440" stroke-dasharray="8 8"/>
    <line x1="0" y1="280" x2="2560" y2="280"/>
    <line x1="0" y1="1160" x2="2560" y2="1160"/>
  </g>

  <!-- 2. Desktop Full Slice Subtle Guide Tint (y=508.5 to 931.5) -->
  <rect x="0" y="508.5" width="2560" height="423" fill="#ffffff" fill-opacity="0.015"/>

  <!-- ================= 3. SAFE AREA (1546 x 423 at x=507, y=508.5) ================= -->
  <!-- Safe Area Card Container -->
  <rect x="507" y="508.5" width="1546" height="423" rx="16" fill="#111317" fill-opacity="0.65" stroke="#232730" stroke-width="1.2"/>

  <!-- Top Golden Accent Line on Card -->
  <path d="M 650 508.5 L 1910 508.5" stroke="url(#goldKeyline)" stroke-width="2"/>

  <!-- Left Content Group (Anchored at x=587, y=580) -->
  <g transform="translate(587, 580)">
    <!-- Micro Kicker Tag -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="180" height="26" rx="13" fill="#1b1e26" stroke="#2e3543" stroke-width="1"/>
      <circle cx="14" cy="13" r="3.5" fill="#d4af37"/>
      <text x="28" y="17.5" fill="#d4af37" font-family="-apple-system, 'Inter', sans-serif" font-size="10.5" font-weight="700" letter-spacing="2">BUSINESS LEADERSHIP</text>
    </g>

    <!-- Main Authority Headline -->
    <text x="0" y="105" fill="#f8f9fa" font-family="Georgia, 'Times New Roman', 'Playfair Display', serif" font-size="76" font-weight="400" letter-spacing="-1">{{TITLE}}</text>

    <!-- Value Proposition Subtitle -->
    <text x="0" y="148" fill="url(#goldText)" font-family="-apple-system, 'Inter', sans-serif" font-size="14.5" font-weight="600" letter-spacing="3">{{TAGLINE}}</text>

    <!-- Lower Divider & Credibility Proof Line -->
    <g transform="translate(0, 220)">
      <line x1="0" y1="-18" x2="680" y2="-18" stroke="#232730" stroke-width="1"/>
      <text x="0" y="8" fill="#f8f9fa" font-family="-apple-system, 'Inter', sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5">{{PROOF_TEXT}}</text>
      <circle cx="280" cy="4.5" r="2.5" fill="#d4af37"/>
      <text x="295" y="8" fill="#8e98a8" font-family="-apple-system, 'Inter', sans-serif" font-size="12" font-weight="500" letter-spacing="1">FORTUNE 500 &amp; FAMILY OFFICES</text>
    </g>
  </g>

  <!-- Right Visual Group: Prestigious Monogram Crest Frame (Anchored at x=1480, y=553) -->
  <g transform="translate(1480, 553.5)" filter="url(#subtleDrop)">
    <!-- Outer Card Frame -->
    <rect x="0" y="0" width="490" height="333" rx="14" fill="#14171d" stroke="#2a313d" stroke-width="1.2"/>
    <rect x="12" y="12" width="466" height="309" rx="10" fill="none" stroke="#242b36" stroke-width="1" stroke-dasharray="4 4"/>

    <!-- Subtle Geometric Emblem inside frame -->
    <g transform="translate(245, 166.5)">
      <!-- Concentric Rings & Diamond -->
      <circle cx="0" cy="0" r="95" fill="none" stroke="#2e3644" stroke-width="1"/>
      <circle cx="0" cy="0" r="75" fill="none" stroke="#d4af37" stroke-opacity="0.3" stroke-width="1"/>
      <polygon points="0,-65 65,0 0,65 -65,0" fill="none" stroke="#d4af37" stroke-opacity="0.5" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="38" fill="#1a1e27" stroke="#d4af37" stroke-width="1.5"/>
      <text x="0" y="8" fill="#f5e6a8" font-family="Georgia, serif" font-size="24" font-weight="bold" text-anchor="middle">A</text>

      <!-- Cardinal Compass Ticks -->
      <line x1="0" y1="-105" x2="0" y2="-95" stroke="#d4af37" stroke-width="1.5"/>
      <line x1="0" y1="95" x2="0" y2="105" stroke="#d4af37" stroke-width="1.5"/>
      <line x1="-105" y1="0" x2="-95" y2="0" stroke="#d4af37" stroke-width="1.5"/>
      <line x1="95" y1="0" x2="105" y2="0" stroke="#d4af37" stroke-width="1.5"/>
    </g>

    <!-- Bottom Readout inside frame -->
    <text x="24" y="300" fill="#64748b" font-family="monospace" font-size="10.5" letter-spacing="1.5">GLOBAL STRATEGY // ADVISORY</text>
    <text x="466" y="300" fill="#d4af37" font-family="monospace" font-size="10.5" font-weight="bold" text-anchor="end">EST. 2026</text>
  </g>
</svg>
