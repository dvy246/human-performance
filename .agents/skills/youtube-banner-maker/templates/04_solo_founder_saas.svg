<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" width="2560" height="1440">
  <defs>
    <!-- Cyber Founder Ambient Mesh Glow -->
    <radialGradient id="founderGlow" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#065f46" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#080c10" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#05070a" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="founderCardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- 1. TV Background Canvas (2560 x 1440) -->
  <rect width="2560" height="1440" fill="#05070a"/>
  <rect width="2560" height="1440" fill="url(#founderGlow)"/>

  <!-- Subtle Dot Matrix Grid in TV Background -->
  <g opacity="0.12" fill="#10b981">
    <circle cx="300" cy="200" r="1.5"/><circle cx="500" cy="200" r="1.5"/><circle cx="700" cy="200" r="1.5"/>
    <circle cx="900" cy="200" r="1.5"/><circle cx="1100" cy="200" r="1.5"/><circle cx="1300" cy="200" r="1.5"/>
    <circle cx="1500" cy="200" r="1.5"/><circle cx="1700" cy="200" r="1.5"/><circle cx="1900" cy="200" r="1.5"/>
    <circle cx="2100" cy="200" r="1.5"/><circle cx="2300" cy="200" r="1.5"/>
    <circle cx="300" cy="1240" r="1.5"/><circle cx="700" cy="1240" r="1.5"/><circle cx="1100" cy="1240" r="1.5"/>
    <circle cx="1500" cy="1240" r="1.5"/><circle cx="1900" cy="1240" r="1.5"/><circle cx="2300" cy="1240" r="1.5"/>
  </g>

  <!-- ================= 2. SAFE AREA (1546 x 423 at x=507, y=508.5) ================= -->
  <!-- Safe Area Card -->
  <rect x="507" y="508.5" width="1546" height="423" rx="16" fill="#090d14" fill-opacity="0.8" stroke="#16202c" stroke-width="1.2"/>

  <!-- Left Content Group (Anchored at x=585, y=580) -->
  <g transform="translate(585, 580)">
    <!-- Live Status Chip with Pulsing Animation -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="220" height="28" rx="6" fill="#062e24" fill-opacity="0.5" stroke="#059669" stroke-width="1"/>
      <circle cx="14" cy="14" r="4" fill="#10b981">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="28" y="19" fill="#34d399" font-family="monospace" font-size="11" font-weight="700" letter-spacing="1">BOOTSTRAPPED // ZERO VC</text>
    </g>

    <!-- Main Headline: Solo Founder Display -->
    <text x="0" y="105" fill="#ffffff" font-family="-apple-system, 'Inter', 'SF Pro Display', sans-serif" font-size="78" font-weight="900" letter-spacing="-2.5">{{TITLE}}</text>

    <!-- Subtitle: Profitable Micro-SaaS Value Prop -->
    <text x="0" y="148" fill="url(#mintGrad)" font-family="-apple-system, 'Inter', sans-serif" font-size="15" font-weight="700" letter-spacing="2">{{TAGLINE}}</text>

    <!-- Tech Stack / Discipline Pills -->
    <g transform="translate(0, 185)">
      <rect x="0" y="0" width="90" height="26" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="45" y="17" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">NEXT.JS</text>

      <rect x="100" y="0" width="85" height="26" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="142.5" y="17" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">PYTHON</text>

      <rect x="195" y="0" width="115" height="26" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="252.5" y="17" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">SUPABASE</text>

      <rect x="320" y="0" width="110" height="26" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="375" y="17" fill="#10b981" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">STRIPE MRR</text>
    </g>

    <!-- Bottom Readout -->
    <g transform="translate(0, 240)">
      <line x1="0" y1="-12" x2="680" y2="-12" stroke="#1e293b" stroke-width="1"/>
      <text x="0" y="10" fill="#94a3b8" font-family="-apple-system, 'Inter', sans-serif" font-size="12" font-weight="600">{{SCHEDULE_PROOF}}</text>
    </g>
  </g>

  <!-- Right Visual Group: Terminal Code & MRR Dashboard Frame (x=1480, y=553) -->
  <g transform="translate(1480, 553.5)" filter="url(#founderCardShadow)">
    <rect x="0" y="0" width="490" height="333" rx="12" fill="#070b10" stroke="#1e293b" stroke-width="1.2"/>

    <!-- Terminal Header Bar -->
    <rect x="0" y="0" width="490" height="36" rx="12" fill="#0e1520"/>
    <rect x="0" y="24" width="490" height="12" fill="#0e1520"/>
    <circle cx="20" cy="18" r="4" fill="#ef4444"/>
    <circle cx="34" cy="18" r="4" fill="#f59e0b"/>
    <circle cx="48" cy="18" r="4" fill="#10b981"/>
    <text x="245" y="22" fill="#64748b" font-family="monospace" font-size="11" text-anchor="middle">founder-terminal — zsh</text>

    <!-- Terminal Body Content -->
    <g transform="translate(24, 60)" font-family="monospace" font-size="12">
      <text x="0" y="20" fill="#64748b">$ npx saas-metrics --live</text>
      <text x="0" y="50" fill="#10b981">✓ Monthly Recurring Revenue: $48,250</text>
      <text x="0" y="80" fill="#e2e8f0">✓ Active Subscribers: 1,840</text>
      <text x="0" y="110" fill="#e2e8f0">✓ Server Overhead: $142/mo (Edge)</text>
      <text x="0" y="140" fill="#38bdf8">✓ Target: $50,000/mo by Q4</text>

      <!-- Prompt Cursor -->
      <text x="0" y="180" fill="#64748b">$ deploy --production</text>
      <rect x="185" y="168" width="8" height="14" fill="#10b981">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>

      <!-- MRR Progress Bar -->
      <g transform="translate(0, 215)">
        <rect x="0" y="0" width="442" height="8" rx="4" fill="#1e293b"/>
        <rect x="0" y="0" width="425" height="8" rx="4" fill="url(#mintGrad)"/>
      </g>
    </g>
  </g>
</svg>
