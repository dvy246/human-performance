<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" width="2560" height="1440">
  <defs>
    <!-- Warm Editorial Amber & Espresso Radial Glow -->
    <radialGradient id="editorialGlow" cx="65%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#382e22" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#181614" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0e0d0c" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="editorialGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6ca65"/>
      <stop offset="50%" stop-color="#c59b27"/>
      <stop offset="100%" stop-color="#9e7514"/>
    </linearGradient>
    <filter id="editorialShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- 1. TV Background Canvas (2560 x 1440) -->
  <rect width="2560" height="1440" fill="url(#editorialGlow)"/>

  <!-- Subtle Editorial Grid Accents for TV widescreen view -->
  <line x1="200" y1="0" x2="200" y2="1440" stroke="#292524" stroke-width="1" stroke-dasharray="4 8" opacity="0.4"/>
  <line x1="2360" y1="0" x2="2360" y2="1440" stroke="#292524" stroke-width="1" stroke-dasharray="4 8" opacity="0.4"/>
  <line x1="0" y1="300" x2="2560" y2="300" stroke="#292524" stroke-width="1" opacity="0.2"/>
  <line x1="0" y1="1140" x2="2560" y2="1140" stroke="#292524" stroke-width="1" opacity="0.2"/>

  <!-- ================= 2. SAFE AREA (1546 x 423 at x=507, y=508.5) ================= -->
  <!-- Framing Bar in Safe Zone -->
  <rect x="507" y="508.5" width="1546" height="423" fill="#141312" opacity="0.6" rx="20"/>
  <rect x="507" y="508.5" width="1546" height="423" fill="none" stroke="#2c2824" stroke-width="1.2" rx="20"/>

  <!-- Left Content Block (Anchored at x=587, y=580) -->
  <g transform="translate(587, 580)">
    <!-- Micro Tag Chip -->
    <rect x="0" y="0" width="220" height="28" rx="14" fill="#1f1d1a" stroke="#44403c" stroke-width="1"/>
    <circle cx="14" cy="14" r="3.5" fill="url(#editorialGoldGrad)"/>
    <text x="30" y="18" fill="#d6d3d1" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="2">ESSAYS &amp; ARCHITECTURE</text>

    <!-- Main Editorial Headline: Serif Display -->
    <text x="0" y="105" fill="#fbf9f5" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="400" letter-spacing="-1">{{TITLE}}</text>

    <!-- Subtitle: Spaced Sans -->
    <text x="0" y="148" fill="#a8a29e" font-family="-apple-system, sans-serif" font-size="15" font-weight="600" letter-spacing="3.5">{{TAGLINE}}</text>

    <!-- Metadata Bottom Line -->
    <g transform="translate(0, 218)">
      <line x1="0" y1="-18" x2="680" y2="-18" stroke="#292524" stroke-width="1.5"/>
      <text x="0" y="10" fill="#e7e5e4" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5">{{SCHEDULE_PROOF}}</text>
      <circle cx="250" cy="6" r="3" fill="#78716c"/>
      <text x="270" y="10" fill="#a8a29e" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="500" letter-spacing="1">SHOT ON 35MM // 4K HDR</text>
      <circle cx="490" cy="6" r="3" fill="#78716c"/>
      <text x="510" y="10" fill="#a8a29e" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="500" letter-spacing="1">LONDON • TOKYO</text>
    </g>
  </g>

  <!-- Right Visual Feature Block: Fine-Art Framed Still (x=1480, y=553) -->
  <g transform="translate(1480, 553.5)" filter="url(#editorialShadow)">
    <rect x="0" y="0" width="490" height="333" rx="14" fill="#1c1917" stroke="#44403c" stroke-width="1.5"/>

    <defs>
      <linearGradient id="photoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#2c241c"/>
        <stop offset="40%" stop-color="#1f1b18"/>
        <stop offset="100%" stop-color="#0f0e0d"/>
      </linearGradient>
      <clipPath id="editorialClip">
        <rect x="0" y="0" width="490" height="333" rx="14"/>
      </clipPath>
    </defs>

    <g clip-path="url(#editorialClip)">
      <rect width="490" height="333" fill="url(#photoGrad)"/>

      <!-- Architectural Sun & Arch Geometry -->
      <circle cx="245" cy="190" r="140" fill="none" stroke="#78716c" stroke-width="1" opacity="0.3"/>
      <circle cx="245" cy="190" r="90" fill="none" stroke="url(#editorialGoldGrad)" stroke-width="1.5" opacity="0.6"/>
      <path d="M 125 333 L 245 140 L 365 333 Z" fill="#141210" opacity="0.8"/>
      <line x1="245" y1="40" x2="245" y2="333" stroke="#44403c" stroke-width="1" stroke-dasharray="3 3"/>

      <!-- Golden Ambient Sun Glow -->
      <circle cx="345" cy="110" r="60" fill="#eab308" opacity="0.18"/>

      <!-- Film Aperture Stamp -->
      <text x="25" y="40" fill="#a8a29e" font-family="monospace" font-size="11" letter-spacing="2">ARRI ALEXA MINI // 50MM T1.5</text>
      <text x="25" y="305" fill="#78716c" font-family="monospace" font-size="11" letter-spacing="1.5">51.5074° N, 0.1278° W</text>
      <text x="455" y="305" fill="url(#editorialGoldGrad)" font-family="monospace" font-size="12" font-weight="bold" text-anchor="end">VOL. IV</text>
    </g>

    <!-- Corner registration marks -->
    <path d="M -10 -10 L 0 -10 M -10 -10 L -10 0" stroke="#78716c" stroke-width="1"/>
    <path d="M 500 -10 L 490 -10 M 500 -10 L 500 0" stroke="#78716c" stroke-width="1"/>
  </g>
</svg>
